<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#4f46e5" stroke-width="3" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 8" />

  <!-- Central Shield -->
  <path d="M256 96 L376 144 V264 C376 344 256 416 256 416 C256 416 136 344 136 264 V144 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#accentGrad)" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <!-- Biometric Fingerprint / Key Motif -->
  <!-- Inner Keyhole & Key Head -->
  <circle cx="256" cy="210" r="38" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <circle cx="256" cy="210" r="16" fill="#38bdf8" />
  <!-- Key stem -->
  <path d="M256 248 V326 M256 280 H284 M256 310 H278" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing pulse arcs -->
  <path d="M200 170 A72 72 0 0 1 312 170" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8" />
  <path d="M180 146 A98 98 0 0 1 332 146" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5" />
</svg>
